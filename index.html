<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECPA">
<meta name="application-name" content="ECPA">
<title>ECPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: vivid app shell — a rounded gradient banner (stage-coloured) carries title, stage switcher and page title; content cards overlap its lower edge; soft colour blobs behind; floating glass tab bar with a gradient active pill */
:root{
  --g1:#2563EB; --g2:#06A3C9;
  --bg:#F3F5FC; --surface:#FFFFFF; --surface-2:#EFF1FA; --ink:#111633; --ink-2:#4B5272; --ink-3:#8A90AE;
  --line:#E8EAF4; --stroke:rgb(17 22 51 / .05);
  --sh:0 1px 2px rgb(17 22 51 / .04), 0 12px 32px -10px rgb(17 22 51 / .14);
  --sh2:0 22px 54px -14px rgb(17 22 51 / .32);
  --glass:rgb(255 255 255 / .86);
  --gt:var(--g1); --gs:color-mix(in srgb,var(--g1) 11%,transparent);
  --blob1:color-mix(in srgb,var(--g2) 16%,transparent); --blob2:color-mix(in srgb,var(--g1) 13%,transparent);
  --on-g:#FFFFFF;
  --ok1:#22C55E; --ok2:#0EA67A; --okt:#059669; --oks:#DDF8E8;
  --ab1:#FB7185; --ab2:#E11D48; --abt:#E11D48; --abs:#FFE4E8;
  --lt1:#FBBF24; --lt2:#EA580C; --ltt:#C2650A; --lts:#FEF3C7;
  --ex1:#C084FC; --ex2:#7C3AED; --ext:#7C3AED; --exs:#F3E8FF;
  --w21:#FB923C; --w22:#DC4A0C; --w2t:#DC4A0C; --w2s:#FFEDD5;
  --scrim:rgb(9 12 30 / .5);
  --fa:"Noto Sans Arabic";
  --f:var(--fa),"Noto Sans Arabic","Vazirmatn",Tahoma,system-ui,sans-serif;
}
:root[data-st="2"]{--g1:#7C3AED;--g2:#DB2777}
:root[data-st="3"]{--g1:#EA580C;--g2:#E11D48}
:root[data-st="4"]{--g1:#059669;--g2:#0284C7}
:root[data-font="vazir"]{--fa:"Vazirmatn"}
:root[data-font="kufi"]{--fa:"Noto Kufi Arabic"}
:root[lang="en"]{--f:"Plus Jakarta Sans",var(--fa),system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#080B19; --surface:#121730; --surface-2:#1B2142; --ink:#EEF1FF; --ink-2:#A9AFD0; --ink-3:#6F769A;
  --line:#232A4D; --stroke:rgb(255 255 255 / .06);
  --sh:0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -12px rgb(0 0 0 / .7); --sh2:0 26px 60px -14px rgb(0 0 0 / .8);
  --glass:rgb(18 23 48 / .86);
  --gt:color-mix(in srgb,var(--g1) 55%,#fff); --gs:color-mix(in srgb,var(--g1) 24%,transparent);
  --blob1:color-mix(in srgb,var(--g2) 22%,transparent); --blob2:color-mix(in srgb,var(--g1) 20%,transparent);
  --okt:#34D399; --oks:#0D2A20; --abt:#FB7185; --abs:#3A1220; --ltt:#FBBF24; --lts:#33260A; --ext:#C084FC; --exs:#2A1A44; --w2t:#FB923C; --w2s:#3A1E0E;
  --scrim:rgb(0 0 0 / .62);
  color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#080B19; --surface:#121730; --surface-2:#1B2142; --ink:#EEF1FF; --ink-2:#A9AFD0; --ink-3:#6F769A;
  --line:#232A4D; --stroke:rgb(255 255 255 / .06);
  --sh:0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -12px rgb(0 0 0 / .7); --sh2:0 26px 60px -14px rgb(0 0 0 / .8);
  --glass:rgb(18 23 48 / .86);
  --gt:color-mix(in srgb,var(--g1) 55%,#fff); --gs:color-mix(in srgb,var(--g1) 24%,transparent);
  --blob1:color-mix(in srgb,var(--g2) 22%,transparent); --blob2:color-mix(in srgb,var(--g1) 20%,transparent);
  --okt:#34D399; --oks:#0D2A20; --abt:#FB7185; --abs:#3A1220; --ltt:#FBBF24; --lts:#33260A; --ext:#C084FC; --exs:#2A1A44; --w2t:#FB923C; --w2s:#3A1E0E;
  --scrim:rgb(0 0 0 / .62);
  color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root[lang="en"] body{line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(135deg,var(--g1),var(--g2))}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(34rem 26rem at 105% 38%,var(--blob1),transparent 62%),radial-gradient(30rem 24rem at -8% 78%,var(--blob2),transparent 62%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--gt);outline-offset:2px}
.wrap{max-width:760px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="ltr"] .flip{transform:scaleX(-1)}

/* status palettes */
.s-ok,.m-p{--ca:var(--ok1);--cb:var(--ok2);--c:var(--okt);--cs:var(--oks)}
.s-w1,.m-l{--ca:var(--lt1);--cb:var(--lt2);--c:var(--ltt);--cs:var(--lts)}
.s-w2{--ca:var(--w21);--cb:var(--w22);--c:var(--w2t);--cs:var(--w2s)}
.s-fail,.m-a{--ca:var(--ab1);--cb:var(--ab2);--c:var(--abt);--cs:var(--abs)}
.m-e{--ca:var(--ex1);--cb:var(--ex2);--c:var(--ext);--cs:var(--exs)}
.c-blue{--ca:#3B82F6;--cb:#06B6D4}.c-violet{--ca:#8B5CF6;--cb:#EC4899}.c-orange{--ca:#F59E0B;--cb:#F43F5E}.c-green{--ca:#10B981;--cb:#0EA5E9}.c-stage{--ca:var(--g1);--cb:var(--g2)}
.bub{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--ca),var(--cb));box-shadow:0 8px 18px -8px var(--cb)}
.bub .i{width:20px;height:20px;stroke-width:2.1}
.gtx{background:linear-gradient(135deg,var(--ca),var(--cb));-webkit-background-clip:text;background-clip:text;color:transparent}

/* banner */
.banner{position:relative;overflow:hidden;color:var(--on-g);background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:0 0 34px 34px;padding-bottom:58px;box-shadow:0 18px 40px -22px var(--g1)}
.banner::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgb(255 255 255 / .12);top:-120px;inset-inline-end:-80px;pointer-events:none}
.banner::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;border:28px solid rgb(255 255 255 / .07);bottom:-90px;inset-inline-start:-50px;pointer-events:none}
.banner .wrap{position:relative;z-index:1}
.bn-top{display:flex;align-items:center;gap:12px;padding-block:16px 14px}
.glass{background:rgb(255 255 255 / .17);border:1px solid rgb(255 255 255 / .26);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.logo{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center}
.logo svg{width:26px;height:26px}
.lg-c{fill:#fff;opacity:.92}.lg-x{fill:#FFB4C0}.lg-w{fill:#FFE08A}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;line-height:1.4}
.brand p{margin:0;font-size:12.5px;opacity:.84;line-height:1.5}
.gbtn{flex:none;height:42px;min-width:42px;border-radius:15px;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;font-weight:700;font-size:13px}
.gbtn .i{width:19px;height:19px}
.stg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sp{position:relative;border-radius:18px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;line-height:1.3;color:#fff;transition:background .2s,color .2s,transform .15s}
.sp b{font-size:21px;font-weight:800;line-height:1.3}
.sp small{font-size:11px;font-weight:600;opacity:.9;white-space:nowrap}
.sp:active{transform:scale(.96)}
.sp[aria-pressed="true"]{background:var(--surface);border-color:transparent;color:var(--ink);box-shadow:0 12px 24px -12px rgb(0 0 0 / .45)}
.sp[aria-pressed="true"] b{background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp .bd{position:absolute;top:-7px;inset-inline-end:-3px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:linear-gradient(135deg,var(--ab1),var(--ab2));color:#fff;font-size:11px;font-weight:800;line-height:21px;text-align:center;box-shadow:0 0 0 2px rgb(255 255 255 / .9)}
.bn-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:18px}
.bn-title p{margin:0;font-size:13px;opacity:.85;font-weight:500}
.bn-title h2{margin:0;font-size:27px;font-weight:800;line-height:1.4;text-wrap:balance}
.bn-chip{flex:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}

/* main */
main{position:relative;z-index:2;margin-top:-44px}
main .wrap{padding-block:0 calc(118px + env(safe-area-inset-bottom,0px))}
body.has-save main .wrap{padding-bottom:calc(196px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:20px}
.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:26px;box-shadow:var(--sh)}
.pad{padding:18px}
.quiet{padding:18px;color:var(--ink-2);font-size:14px}
.quiet p{margin:0}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 6px 10px}
.sh h3{margin:0;font-size:17px;font-weight:800}
.sh small{color:var(--ink-3);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:16px;border:0;font-weight:700;font-size:14.5px;background:var(--surface-2);color:var(--ink);transition:transform .1s ease,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 12px 24px -12px var(--g1)}
.btn.soft{background:var(--gs);color:var(--gt)}
.btn.danger{background:linear-gradient(135deg,var(--ab1),var(--ab2));color:#fff;box-shadow:0 12px 24px -12px var(--ab2)}
.btn.dsoft{background:var(--abs);color:var(--abt)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:13px;border-radius:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.link{border:0;background:none;padding:0;color:var(--gt);font-weight:700}

/* home */
.hero{display:flex;align-items:center;gap:18px;padding:18px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--surface-2);stroke-width:11}
.ring .pr{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .7s ease}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.ring b{font-size:23px;font-weight:800}
.ring small{font-size:11px;color:var(--ink-3);font-weight:600}
.hst{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.sb{display:flex;align-items:center;gap:11px}
.sb .bub{width:38px;height:38px;border-radius:13px}
.sb .bub .i{width:18px;height:18px}
.sb div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.sb b{font-size:18px;font-weight:800}
.sb small{font-size:12px;color:var(--ink-3);font-weight:600}
.gcta{width:100%;min-height:62px;border:0;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;gap:12px;padding:8px 10px;padding-inline-start:16px;font-weight:800;font-size:16px;box-shadow:0 18px 34px -14px var(--g1);transition:transform .12s}
.gcta:active{transform:scale(.98)}
.gcta .gi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgb(255 255 255 / .2)}
.gcta span.t{flex:1;text-align:start}
.gcta .arr{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#fff;color:var(--g1)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.tile{border:1px solid var(--stroke);background:var(--surface);border-radius:22px;padding:12px 4px 10px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);text-align:center}
.tile .bub{width:34px;height:34px;border-radius:12px;margin-bottom:4px}
.tile .bub .i{width:17px;height:17px}
.tile b{font-size:22px;font-weight:800;line-height:1.35}
.tile span.l{font-size:11px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.hcards{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 14px;scroll-snap-type:x proximity}
.hcards::-webkit-scrollbar{display:none}
.sc{flex:none;width:172px;scroll-snap-align:start;border:1px solid var(--stroke);background:var(--surface);border-radius:24px;box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;color:var(--ink)}
.sc .dt{width:50px;height:50px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));margin-bottom:4px}
.sc .dt b{font-size:18px;font-weight:800}
.sc .dt small{font-size:9.5px;font-weight:600;opacity:.92}
.sc .ttl{font-weight:800;font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.sc .mt{font-size:12px;color:var(--ink-3)}

/* lists */
.list{list-style:none;margin:0;padding:6px 0;overflow:hidden}
.list>li{position:relative}
.list>li+li::before{content:"";position:absolute;top:0;inset-inline:72px 18px;height:1px;background:var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;width:100%;border:0;background:none;text-align:start;color:var(--ink)}
.av{width:46px;height:46px;border-radius:16px;flex:none;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;line-height:1;background:linear-gradient(135deg,hsl(var(--h) 88% 60%),hsl(calc(var(--h) + 38) 82% 50%));box-shadow:0 8px 16px -10px hsl(var(--h) 80% 45%)}
.av.sm{width:38px;height:38px;border-radius:13px;font-size:14px}
.av.lg{width:72px;height:72px;border-radius:24px;font-size:25px}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.rt b{font-weight:700;font-size:15px}
.rt small{color:var(--ink-3);font-size:12.5px}
.re{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pc{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.mbar{width:64px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ca),var(--cb))}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.7;background:var(--cs);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--ca),var(--cb));flex:none}
.pill.solid{background:linear-gradient(135deg,var(--ca),var(--cb));color:#fff}
.pill.solid::before{background:#fff}

/* roll call */
.ctl{padding:18px;display:flex;flex-direction:column;gap:16px}
.fl{display:block;font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:8px}
.segc{display:inline-flex;padding:4px;gap:4px;background:var(--surface-2);border-radius:16px;max-width:100%;flex-wrap:wrap}
.segc button{border:0;background:transparent;border-radius:12px;padding:5px 16px;font-weight:700;font-size:13.5px;color:var(--ink-2);min-height:38px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.segc button[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 16px -8px var(--g1)}
.segc button .i{width:17px;height:17px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:2px 18px 6px}
.hs::-webkit-scrollbar{display:none}
.chipb{flex:none;border:0;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600;min-height:40px;white-space:nowrap;transition:background .15s,color .15s}
.chipb[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 16px -8px var(--g1)}
.drow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drow .dl{color:var(--ink-2);font-size:13.5px;font-weight:700}
.note{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:16px;background:var(--gs);font-size:13px;line-height:1.75;color:var(--ink)}
.note .i{color:var(--gt);margin-top:3px}
.cnt4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.cnt{border-radius:22px;padding:10px 4px 9px;background:var(--surface);border:1px solid var(--stroke);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:1px}
.cnt .bub{width:32px;height:32px;border-radius:11px;margin-bottom:3px}
.cnt .bub .i{width:16px;height:16px;stroke-width:2.4}
.cnt b{font-size:20px;font-weight:800;line-height:1.35}
.cnt span{font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.rollbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 6px}
.rollbar small{color:var(--ink-3);font-size:12px}
.roll{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:4px}
.rr{display:flex;align-items:center;gap:10px;padding:8px;border-radius:20px;transition:background .18s}
.rr.m-a,.rr.m-l,.rr.m-e{background:var(--cs)}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:start;color:var(--ink)}
.who .rt b{font-size:14.5px;line-height:1.45}
.who .rt small{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px}
.marks{display:flex;gap:4px;flex:none}
.mk{width:36px;height:36px;border-radius:12px;border:0;background:var(--surface-2);color:var(--ink-3);display:grid;place-items:center;padding:0;transition:transform .1s,box-shadow .15s}
.rr.m-a .mk,.rr.m-l .mk,.rr.m-e .mk{background:var(--surface)}
.mk .i{width:18px;height:18px;stroke-width:2.4}
.mk:active{transform:scale(.9)}
.mk[aria-checked="true"]{background:linear-gradient(135deg,var(--ca),var(--cb))!important;color:#fff;box-shadow:0 8px 16px -8px var(--cb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

function statsFor(st,sub){return cached('st|'+st.id+'|'+sub.id,()=>{
  if(isDrop(st.id,sub.id))return NA_DROP;const sec=carrySec(st.id,sub.id)||(+sub.stage===+st.stage?st.section:null);
  if(!sec||!teaches(sub,sec))return NA;
  const c=cfg(),ses=sessionsFor(sub.id,sec);let a=0,l=0,e=0,p=0;const marks=[];
  Object.keys(ses).sort().forEach(dt=>{const m=ses[dt]&&ses[dt][st.id];if(!m)return;marks.push([dt,m]);if(m==='a')a++;else if(m==='l')l++;else if(m==='e')e++;else p++;});
  const total=Math.max(1,Math.round(+sub.total||30)),pu=a/total*100,pt=(a+e)/total*100,eps=1e-9;
  let status='ok';if(pu+eps>=c.fail||pt+eps>=c.failTotal)status='fail';else if(pu+eps>=c.warn2)status='w2';else if(pu+eps>=c.warn1)status='w1';
  return {a,l,e,p,held:marks.length,total,pu,pt,status,marks};});}

/* ---- roll call ---- */
function takeCtx(){const c=cfg(),tk=S.take,all=subjectsOf(S.stage).filter(s=>c.sections.some(sec=>teaches(s,sec)&&canTake(s.id,sec)));
  let secs=c.sections.filter(sec=>all.some(s=>teaches(s,sec)&&canTake(s.id,sec)));if(!secs.length)secs=c.sections.slice(0,1);
  if(secs.indexOf(tk.section)<0)tk.section=secs[0];
  const subs=all.filter(s=>teaches(s,tk.section)&&canTake(s.id,tk.section));if(!subs.some(s=>s.id===tk.sub))tk.sub=subs.length?subs[0].id:null;
  return {c,tk,subs,secs,all};}

  const sub=subs.find(s=>s.id===S.rep.sub),list=[].concat(...cfg().sections.filter(sec=>teaches(sub,sec)).map(sec=>roster(sub,sec)));

async function saveTake(){if(!CAN_WRITE)return;const x=takeCtx(),tk=x.tk;if(!tk.sub)return;const list=roster(curSub(),tk.section);if(!list.length)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(tk.date)){toast(t('errDate'),'err');return;}
  const rec={};list.forEach(s=>{rec[s.id]=tk.rec[s.id]||'p';});
  const b=$('[data-act="save-take"]');if(b)b.disabled=true;
  const ok=await saveSession(attKey(x.c.year,tk.sub,tk.section),{year:x.c.year,subjectId:tk.sub,section:tk.section,stage:S.stage},tk.date,rec);
  if(ok){tk.dirty=false;toast(t('savedToast',countOf(rec,'a')));}render();}
async function saveTeacher(){const te=S.tedit;if(!te)return;
  const name=(($('#tn')&&$('#tn').value)||'').trim(),email=toLogin(($('#te')&&$('#te').value)||''),pass=(($('#tp')&&$('#tp').value)||'').trim();
  te.name=name;te.email=showLogin(email);te.pass=pass;
  if(!name){toast(t('errName'),'err');return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||(email.endsWith('@'+USER_DOMAIN)&&!/^[a-z0-9._-]{2,40}@/.test(email))){toast(t(email.endsWith('@'+USER_DOMAIN)?'errUser':'errEmail'),'err');return;}
  if((!te.id||pass)&&pass.length<8){toast(t('errPass'),'err');return;}
  const assign={};Object.keys(te.assign).forEach(k=>{const a=(te.assign[k]||[]).filter(Boolean);if(a.length&&D.subjects[k])assign[k]=a.slice().sort();});
  busy(t('savingT'));let id=te.id;
  if(!id){const r=await callFn({action:'create',full_name:name,email,password:pass});if(!r.ok){busy(null);toast(fnMsg(r.code),'err');return;}id=r.data.id;}
  else{const old=D.teachers[id]||{},patch={action:'update',id};if(name!==old.name)patch.full_name=name;if(email!==(old.email||''))patch.email=email;if(pass)patch.password=pass;
    if(Object.keys(patch).length>2){const r=await callFn(patch);if(!r.ok){busy(null);toast(fnMsg(r.code),'err');return;}}}
  const rows=[];Object.keys(assign).forEach(sid=>assign[sid].forEach(sec=>rows.push({subject_id:sid,section:sec,teacher_id:id})));
  let ok=await run(sb.from(T.assign).delete().eq('teacher_id',id));
  if(ok&&rows.length)ok=await run(sb.from(T.assign).insert(rows));
  if(ok){const want=te.role==='head'?'head':'teacher',cur=(D.teachers[id]&&D.teachers[id].role)||'teacher';if(want!==cur)ok=await run(sb.from(T.profiles).update({role:want}).eq('id',id));}
  await reload(['profiles','assign']);busy(null);
  if(ok&&S.subDraft){const d=S.subDraft;cfg().sections.forEach(sec=>{const on=(assign[d.id]||[]).indexOf(sec)>=0,l=d.t[sec]||(d.t[sec]=[]),i=l.indexOf(id);if(on&&i<0)l.push(id);if(!on&&i>=0)l.splice(i,1);});}
  if(ok){S.tedit=null;S.reveal=pass?{id,pass}:null;S.sheet={type:'teacher',id};renderOverlay();toast(t('teacherSaved'));}}

    let err=null;try{const r=await sb.auth.signInWithPassword({email,password:pw});err=r.error;}catch(e){err=e||{};}
    LOGIN.busy=false;if(err){LOGIN.err=/invalid|credential|password|email/i.test(String(err.message||''))?'bad':'net';render();}},
  fSubAdd:async f=>{const ae=document.activeElement;if(S.edit&&ae&&['xn','xt','xm'].indexOf(ae.id)>=0){ACT['sub-save']({dataset:{id:S.edit}});return;}
    const name=$('#nn',f).value.trim(),total=parseInt(toW($('#nt',f).value),10);
    if(!name){toast(t('errSubj'),'err');return;}if(!(total>=1&&total<=300)){toast(t('errTotal'),'err');return;}
    const order=subjectsOf(S.stage).reduce((m,s)=>Math.max(m,+s.order||0),0)+1;
    if(await setDoc('subjects',uid(),{name,total,stage:S.stage,order})){if(document.activeElement)document.activeElement.blur();render();toast(t('subAdded'));}},
  fRules:async f=>{const g=k=>parseFloat(toW($('#r'+k,f).value)),w1=g('w1'),w2=g('w2'),fl=g('fl'),ft=g('ft');
    if(![w1,w2,fl,ft].every(v=>v>0&&v<=100)){toast(t('errRange'),'err');return;}if(!(w1<w2&&w2<=fl&&fl<=ft)){toast(t('errOrder'),'err');return;}
    if(await setDoc('config','main',Object.assign({},DEF_CFG,D.config.main||{},{warn1:w1,warn2:w2,fail:fl,failTotal:ft}))){if(document.activeElement)document.activeElement.blur();render();toast(t('rulesSaved'));}},
  fGeneral:async f=>{const unit=$('#gu',f).value.trim(),year=toW($('#gy',f).value).replace(/\s|–|—/g,'-').replace(/-+/g,'-'),m=/^(\d{4})-(\d{4})$/.exec(year);
    if(!m||+m[2]!==+m[1]+1){toast(t('errYear'),'err');return;}
    const secs=$('#gs',f).value.split(/[,،\s]+/).map(s=>s.trim().toUpperCase()).filter(s=>/^[A-Z0-9]{1,4}$/.test(s)).filter((s,i,a)=>a.indexOf(s)===i);
    if(!secs.length){toast(t('errSec'),'err');return;}
    if(await setDoc('config','main',Object.assign({},DEF_CFG,D.config.main||{},{unit,year,sections:secs}))){S.take.key=null;if(document.activeElement)document.activeElement.blur();render();toast(t('savedShort'));}}
};

/* ================= events ================= */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');
  if(b){if(b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e);}return;}
  const o=e.target.classList&&e.target.classList.contains('ovl')?e.target:null;
  if(o){const k=o.dataset.close;if(k==='sheet'){S.sheet=null;S.tedit=null;S.reveal=null;}else if(k==='copy')S.copy=null;else if(k==='menu')S.menu=null;else if(k==='confirm'){S.confirm=null;render();return;}renderOverlay();}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();const h=FORMS[f.id];if(h)h(f);});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='tdate'){const v=el.value;if(!v){render();return;}guardDirty(()=>{S.take.date=v;render();});}
  else if(el.dataset&&el.dataset.subt&&el.value){grabSub();const d=S.subDraft;if(d){const l=d.t[el.dataset.subt]||(d.t[el.dataset.subt]=[]);if(l.indexOf(el.value)<0)l.push(el.value);}render();}
  else if(el.classList&&el.classList.contains('msck')){if(el.dataset.msAll){msList().forEach(s=>{if(el.checked)S.ms.sel[s.id]=1;else delete S.ms.sel[s.id];});const l=$('#msList');if(l)l.innerHTML=msRows();}
    else{if(el.checked)S.ms.sel[el.dataset.ms]=1;else delete S.ms.sel[el.dataset.ms];}msRefresh();}
  else if(el.id==='msTo'){S.ms.to=+el.value;}
  else if(el.id==='rsFile'){const f=el.files&&el.files[0];el.value='';if(f)pickRestore(f);}
  else if(el.id==='ssort'){S.stu.sort=el.value;const l=$('#stuList');if(l)l.innerHTML=stuRows();}});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='sq'){S.stu.q=e.target.value;const l=$('#stuList');if(l)l.innerHTML=stuRows();}
  else if(S.tedit&&(id==='tn'||id==='te'||id==='tp'))S.tedit[{tn:'name',te:'email',tp:'pass'}[id]]=e.target.value;
  else if(S.subDraft&&(id==='xn'||id==='xt'))S.subDraft[id==='xn'?'name':'total']=e.target.value;
  else if(id==='msq'){S.ms.q=e.target.value;const l=$('#msList');if(l)l.innerHTML=msRows();msRefresh();}
  else if(id==='le')LOGIN.email=e.target.value;});
document.addEventListener('focusout',()=>{if(pend)setTimeout(()=>{if(pend&&!isTyping())render();},80);});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||S.busy)return;
  if(S.confirm){S.confirm=null;render();}else if(S.menu){S.menu=null;renderOverlay();}else if(S.copy){S.copy=null;renderOverlay();}else if(S.sheet){S.sheet=null;S.tedit=null;S.reveal=null;renderOverlay();}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(THEME==='auto')renderTop();});}catch(e){}
try{new MutationObserver(()=>{if(THEME==='auto')renderTop();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

/* ================= boot ================= */
async function init(){
  try{const u=JSON.parse(localStorage.getItem(UI_KEY)||'{}');if(u.stage>=1&&u.stage<=4)S.stage=+u.stage;if(VIEWS.indexOf(u.view)>=0)S.view=u.view;if(L[u.lang])LANG=u.lang;
    if(['auto','light','dark'].indexOf(u.theme)>=0)THEME=u.theme;}catch(e){}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;renderTop();if(S.view==='settings')render();});
  window.addEventListener('appinstalled',()=>{DEFER=null;toast(t('installed'));render();});
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}
  render();
  const lib=window.supabase,conf=window.ECPA_CONFIG||{};
  if(!lib||typeof lib.createClient!=='function'||!conf.url||!conf.key){AUTH='nolib';READY=true;render();return;}
  sb=lib.createClient(conf.url,conf.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  MODE='db';downloads=true;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='SIGNED_OUT'){setTimeout(()=>startSession(null),0);return;}
    if(session&&(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')){setTimeout(()=>startSession(session),0);return;}
    if(ev==='INITIAL_SESSION'&&!session)setTimeout(()=>startSession(null),0);});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AUTH==='ready'&&Date.now()-lastLoad>20000)loadAll();});
}
init();
})();

</script>
